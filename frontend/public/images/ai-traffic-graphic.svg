<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <rect width="800" height="600" fill="url(#paint0_linear)"/>
  
  <!-- Decorative Elements -->
  <circle cx="150" cy="150" r="80" fill="#3B82F6" fill-opacity="0.1"/>
  <circle cx="650" cy="450" r="120" fill="#3B82F6" fill-opacity="0.1"/>
  <circle cx="700" cy="150" r="50" fill="#3B82F6" fill-opacity="0.1"/>
  <circle cx="100" cy="500" r="70" fill="#3B82F6" fill-opacity="0.1"/>
  
  <!-- Main Card -->
  <rect x="100" y="100" width="600" height="400" rx="20" fill="white" fill-opacity="0.9" stroke="#3B82F6" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="100" y="100" width="600" height="100" fill="#3B82F6" fill-opacity="0.1" rx="20 20 0 0"/>
  <text x="400" y="170" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1E40AF" text-anchor="middle">AI Traffic Classification</text>
  <text x="400" y="210" font-family="Arial, sans-serif" font-size="18" fill="#1F2937" text-anchor="middle">Computer Vision for Traffic Management</text>
  
  <!-- App Preview -->
  <rect x="150" y="230" width="500" height="200" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
  
  <!-- Road -->
  <rect x="200" y="300" width="400" height="100" fill="#6B7280"/>
  <line x1="200" y1="350" x2="600" y2="350" stroke="white" stroke-width="4" stroke-dasharray="20,10"/>
  
  <!-- Vehicles -->
  <rect x="250" y="320" width="60" height="30" rx="5" fill="#EF4444"/>
  <rect x="400" y="280" width="60" height="30" rx="5" fill="#10B981" transform="rotate(10, 400, 280)"/>
  <rect x="500" y="330" width="60" height="30" rx="5" fill="#F59E0B" transform="rotate(-5, 500, 330)"/>
  
  <!-- AI Elements -->
  <circle cx="300" cy="400" r="15" fill="#3B82F6"/>
  <path d="M300 385 L310 395 L290 395 Z" fill="white"/>
  
  <circle cx="500" cy="400" r="15" fill="#3B82F6"/>
  <path d="M490 395 L510 395 L500 415 Z" fill="white"/>
  
  <!-- Tech Stack Icons -->
  <circle cx="200" cy="480" r="25" fill="#3B82F6" fill-opacity="0.1" stroke="#3B82F6" stroke-width="1"/>
  <text x="200" y="485" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E40AF" text-anchor="middle">CV</text>
  
  <circle cx="300" cy="480" r="25" fill="#3B82F6" fill-opacity="0.1" stroke="#3B82F6" stroke-width="1"/>
  <text x="300" y="485" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E40AF" text-anchor="middle">DL</text>
  
  <circle cx="400" cy="480" r="25" fill="#3B82F6" fill-opacity="0.1" stroke="#3B82F6" stroke-width="1"/>
  <text x="400" y="485" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E40AF" text-anchor="middle">Py</text>
  
  <circle cx="500" cy="480" r="25" fill="#3B82F6" fill-opacity="0.1" stroke="#3B82F6" stroke-width="1"/>
  <path d="M490 470 L510 470 L510 490 L490 490 Z" fill="#3B82F6" fill-opacity="0.8"/>
  
  <circle cx="600" cy="480" r="25" fill="#3B82F6" fill-opacity="0.1" stroke="#3B82F6" stroke-width="1"/>
  <path d="M590 470 L610 470 L600 490 Z" fill="#3B82F6" fill-opacity="0.8"/>
  
  <defs>
    <linearGradient id="paint0_linear" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EFF6FF"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>
