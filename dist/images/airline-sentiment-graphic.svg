<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <rect width="800" height="600" fill="url(#paint0_linear)"/>
  
  <!-- Decorative Elements -->
  <circle cx="150" cy="150" r="80" fill="#8B5CF6" fill-opacity="0.1"/>
  <circle cx="650" cy="450" r="120" fill="#8B5CF6" fill-opacity="0.1"/>
  <circle cx="700" cy="150" r="50" fill="#8B5CF6" fill-opacity="0.1"/>
  <circle cx="100" cy="500" r="70" fill="#8B5CF6" fill-opacity="0.1"/>
  
  <!-- Main Card -->
  <rect x="100" y="100" width="600" height="400" rx="20" fill="white" fill-opacity="0.9" stroke="#8B5CF6" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="100" y="100" width="600" height="100" fill="#8B5CF6" fill-opacity="0.1" rx="20 20 0 0"/>
  <text x="400" y="170" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#5B21B6" text-anchor="middle">Airline Sentiment Analysis</text>
  <text x="400" y="210" font-family="Arial, sans-serif" font-size="18" fill="#1F2937" text-anchor="middle">NLP for Customer Feedback</text>
  
  <!-- App Preview -->
  <rect x="150" y="230" width="500" height="200" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1"/>
  
  <!-- Sentiment Chart -->
  <!-- X-axis -->
  <line x1="200" y1="400" x2="600" y2="400" stroke="#A78BFA" stroke-width="2"/>
  <!-- Y-axis -->
  <line x1="200" y1="400" x2="200" y2="250" stroke="#A78BFA" stroke-width="2"/>
  
  <!-- Positive Bar -->
  <rect x="250" y="300" width="60" height="100" fill="#10B981" rx="4"/>
  <text x="280" y="390" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1F2937">Positive</text>
  
  <!-- Neutral Bar -->
  <rect x="370" y="250" width="60" height="150" fill="#F59E0B" rx="4"/>
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1F2937">Neutral</text>
  
  <!-- Negative Bar -->
  <rect x="490" y="320" width="60" height="80" fill="#EF4444" rx="4"/>
  <text x="520" y="410" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1F2937">Negative</text>
  
  <!-- AI Elements -->
  <circle cx="300" cy="450" r="15" fill="#8B5CF6"/>
  <path d="M300 435 L310 445 L290 445 Z" fill="white"/>
  
  <circle cx="500" cy="450" r="15" fill="#8B5CF6"/>
  <path d="M490 445 L510 445 L500 465 Z" fill="white"/>
  
  <!-- Tech Stack Icons -->
  <circle cx="200" cy="530" r="25" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-width="1"/>
  <text x="200" y="535" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#5B21B6" text-anchor="middle">NLP</text>
  
  <circle cx="300" cy="530" r="25" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-width="1"/>
  <text x="300" y="535" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#5B21B6" text-anchor="middle">ML</text>
  
  <circle cx="400" cy="530" r="25" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-width="1"/>
  <text x="400" y="535" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#5B21B6" text-anchor="middle">Py</text>
  
  <circle cx="500" cy="530" r="25" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-width="1"/>
  <path d="M490 520 L510 520 L510 540 L490 540 Z" fill="#8B5CF6" fill-opacity="0.8"/>
  
  <circle cx="600" cy="530" r="25" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-width="1"/>
  <path d="M590 520 L610 520 L600 540 Z" fill="#8B5CF6" fill-opacity="0.8"/>
  
  <defs>
    <linearGradient id="paint0_linear" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F3FF"/>
      <stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
  </defs>
</svg>
